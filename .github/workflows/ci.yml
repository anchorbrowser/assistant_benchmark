name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate agent registry against the schema
        run: python3 runner/validate_agents.py
      - name: Suite self-test (checks, guards, oracle vs careless)
        run: python3 runner/selftest.py
